[workspace]
members = ["crates/oven-sdk", "crates/oven-sdk-conformance"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
bitflags = { version = "2", features = ["serde"] }
bytes = { version = "1", features = ["serde"] }
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }

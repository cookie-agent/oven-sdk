[package]
name = "oven-sdk-open-responses"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Registry-free Open Responses adapter with a Hugging Face transport profile"
repository = "https://github.com/cookie-agent/oven-sdk"
readme = "README.md"
keywords = ["open-responses", "huggingface", "llm", "ai", "sdk"]
categories = ["api-bindings"]

[lib]
name = "oven_sdk_open_responses"

[dependencies]
base64.workspace = true
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
oven-sdk = { path = "../oven-sdk", version = "=0.4.0" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
oven-sdk-conformance = { path = "../oven-sdk-conformance", version = "=0.4.0" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6"

[package]
name = "oven-sdk-bedrock"
version = "0.3.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Amazon Bedrock Converse and ConverseStream adapter for oven-sdk"
repository = "https://github.com/cookie-agent/oven-sdk"
readme = "README.md"
keywords = ["aws", "bedrock", "llm", "sdk", "converse"]
categories = ["api-bindings"]

[lib]
name = "oven_sdk_bedrock"

[dependencies]
base64.workspace = true
bytes.workspace = true
crc32fast.workspace = true
futures-core.workspace = true
futures-util.workspace = true
hex.workspace = true
hmac.workspace = true
oven-sdk = { path = "../oven-sdk", version = "=0.4.0" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
oven-sdk-conformance = { path = "../oven-sdk-conformance", version = "=0.4.0" }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }
wiremock = "0.6"

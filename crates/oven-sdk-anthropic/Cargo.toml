[package]
name = "oven-sdk-anthropic"
version = "0.5.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Anthropic, compatible Messages, MiniMax, and Claude Platform on AWS adapters for oven-sdk"
repository = "https://github.com/cookie-agent/oven-sdk"
readme = "README.md"

[lib]
name = "oven_sdk_anthropic"

[dependencies]
base64.workspace = true
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
hmac.workspace = true
hex.workspace = true
oven-sdk = { path = "../oven-sdk", version = "=0.4.0" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
httpdate.workspace = true
oven-sdk-conformance = { path = "../oven-sdk-conformance", version = "=0.4.0" }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }
wiremock = "0.6"
